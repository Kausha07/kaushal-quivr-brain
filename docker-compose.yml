version: '3.8'
services:
  api:
    build: .
    ports: ['3000:3000']
    env_file: .env
    depends_on: [postgres, redis]
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omnibrain
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
